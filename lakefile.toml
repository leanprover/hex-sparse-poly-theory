name = "hex-sparse-poly-theory"
defaultTargets = ["HexSparsePolyTheory"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexPoly"
git = "https://github.com/leanprover/hex-poly.git"
rev = "v0.10.0"

[[require]]
name = "HexPolyTheory"
git = "https://github.com/leanprover/hex-poly-theory.git"
rev = "v0.10.0"

[[require]]
name = "HexSparsePoly"
git = "https://github.com/leanprover/hex-sparse-poly.git"
rev = "v0.10.0"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "6b7abb3c7686292736be2955bd3eb9ebf63b456a"

[[lean_lib]]
name = "HexSparsePolyTheory"
